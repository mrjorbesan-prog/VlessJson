<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:#17202a}
  .wrap{max-width:1000px;margin:28px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 12px 35px #11182712;margin-bottom:16px}
  h1{font-size:25px;margin:0 0 20px;text-align:center;letter-spacing:.2px}
  p{color:#667085;margin:6px 0 18px;line-height:1.8}
  label{display:block;font-weight:700;margin:14px 0 7px}
  textarea{width:100%;min-height:165px;resize:vertical;border:1px solid #ccd3da;border-radius:10px;padding:12px;font:14px/1.8 Consolas,monospace;direction:ltr;text-align:left}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  button{border:0;border-radius:11px;padding:11px 17px;cursor:pointer;font-weight:700;transition:.15s}
  .primary{background:#2563eb;color:#fff}.secondary{background:#eef2f6;color:#17202a}.primary:hover,.secondary:hover{filter:brightness(.96)}
  pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;background:#10151b;color:#e7edf3;padding:16px;border-radius:10px;max-height:600px;overflow:auto;font:13px/1.6 Consolas,monospace}
  .status{padding:10px 12px;border-radius:9px;margin-top:12px;display:none}
  .ok{display:block;background:#e9f8ef;color:#176b39}.err{display:block;background:#fff0f0;color:#a61b1b}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
  .field{background:#f7f9fb;border-radius:10px;padding:10px}.field small{display:block;color:#667085;margin-bottom:4px}.field code{direction:ltr;display:block;word-break:break-all}
</style>
</head>
<body>

  <div class="card">
    <h1>vless to json</h1>

    <label for="vless">لینک VLESS</label>
    <textarea id="vless" placeholder="vless://..."></textarea>

    <div class="row">
      <button class="primary" onclick="convert()">تبدیل</button>
      <button class="secondary" onclick="copyOutput()">کپی JSON</button>
      <button class="secondary" onclick="downloadOutput()">دانلود JSON</button>
      <button class="secondary" onclick="clearAll()">پاک کردن</button>
    </div>

    <div id="status" class="status"></div>
    <div id="fields" class="fields"></div>
  </div>

  <div class="card">
    <label>خروجی JSON</label>
    <pre id="output">{}</pre>
  </div>
</div>

function parseVless(raw){
  raw = raw.trim();
  if(!raw.toLowerCase().startsWith("vless://")) throw new Error("لینک باید با vless:// شروع شود.");

  const u = new URL(raw);
  const uuid = decodeURIComponent(u.username);
  if(!uuid) throw new Error("UUID پیدا نشد.");

  const address = u.hostname;
  const port = u.port ? Number(u.port) : 443;
  const q = u.searchParams;

  const host = q.get("host") || "";
  const path = q.get("path") || "";
  const sni = q.get("sni") || "";

  if(!address) throw new Error("Address پیدا نشد.");
  if(!host) throw new Error("پارامتر host در لینک وجود ندارد.");
  if(!path) throw new Error("پارامتر path در لینک وجود ندارد.");
  if(!sni) throw new Error("پارامتر sni در لینک وجود ندارد.");

  return {uuid,address,port,host,path,sni};
}

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function convert(){
  const status = document.getElementById("status");
  const out = document.getElementById("output");
  const fields = document.getElementById("fields");

  try{
    const v = parseVless(document.getElementById("vless").value);
    const cfg = clone(TEMPLATE);
    const proxy = cfg.outbounds[0];

    proxy.settings.id = v.uuid;
    proxy.settings.address = v.address;
    proxy.settings.port = v.port;
    proxy.streamSettings.wsSettings.host = v.host;
    proxy.streamSettings.wsSettings.path = v.path;
    proxy.streamSettings.tlsSettings.serverName = v.sni;

    // remarks مطابق آدرس و پورت ورودی
    cfg.remarks = `cfg-${v.address}-${v.port}`;

    out.textContent = JSON.stringify(cfg, null, 2);

    fields.innerHTML = `
      <div class="field"><small>UUID</small><code>${esc(v.uuid)}</code></div>
      <div class="field"><small>Address:Port</small><code>${esc(v.address + ":" + v.port)}</code></div>
      <div class="field"><small>Host</small><code>${esc(v.host)}</code></div>
      <div class="field"><small>Path</small><code>${esc(v.path)}</code></div>
      <div class="field"><small>SNI</small><code>${esc(v.sni)}</code></div>
    `;
    status.className = "status ok";
    status.textContent = "تبدیل با موفقیت انجام شد.";
  }catch(e){
    status.className = "status err";
    status.textContent = e.message;
    fields.innerHTML = "";
    out.textContent = "{}";
  }
}

function esc(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getOutput(){
  const text = document.getElementById("output").textContent.trim();
  if(text === "{}") throw new Error("اول لینک VLESS را تبدیل کنید.");
  return text;
}

function copyOutput(){
  try{
    const text = getOutput();

    // روش ساده و سازگارتر با فایل HTML محلی و موبایل
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    ta.style.top = "0";
    ta.setAttribute("readonly", "");
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);

    const ok = document.execCommand("copy");
    document.body.removeChild(ta);

    if(ok) {
      show("JSON کپی شد.","ok");
    } else {
      throw new Error("کپی خودکار توسط مرورگر پشتیبانی نشد.");
    }
  }catch(e){
    show(e.message,"err");
  }
}

function downloadOutput(){
  try{
    const text = getOutput();
    const blob = new Blob([text], {type:"application/json;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "xray-config.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  }catch(e){ show(e.message,"err"); }
}

function show(msg, type){
  const s=document.getElementById("status");
  s.className="status "+type;
  s.textContent=msg;
}

function clearAll(){
  document.getElementById("vless").value="";
  document.getElementById("output").textContent="{}";
  document.getElementById("fields").innerHTML="";
  document.getElementById("status").className="status";
  document.getElementById("status").textContent="";
}
</script>
